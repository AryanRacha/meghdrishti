[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.0",
    "fastapi>=0.141.1",
    "netcdf4>=1.7.4",
    "numpy>=2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scipy>=1.14",
    "torch==2.13.0",
    "transformers>=4.45",
    "uvicorn>=0.54.0",
    "xarray>=2026.7.0",
    "cfgrib>=0.9.15.1",
    "eccodes>=2.49.0",
    "ecmwf-opendata>=0.3.34",
    "gradio>=6.29.1",
    "spaces>=0.51.3",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
dev = "app.main:dev"
start = "app.main:start"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

